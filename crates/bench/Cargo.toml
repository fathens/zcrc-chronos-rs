[package]
name = "bench"
version.workspace = true
edition.workspace = true

[dependencies]
common = { workspace = true }
normalize = { workspace = true }
analyzer = { workspace = true }
selector = { workspace = true }
models = { workspace = true }
trainer = { workspace = true }
predictor = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
num-traits = { workspace = true }
bigdecimal = { workspace = true }
# CLI / IO dependencies — gated behind the `cli` feature so that library
# consumers (e.g. future direct deps) do not pull in clap/csv/serde_json/anyhow.
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
rusty-hook = "0.11"
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:csv", "dep:serde_json", "dep:tracing-subscriber"]

[[bin]]
name = "predict_sweep"
path = "src/bin/predict_sweep.rs"
required-features = ["cli"]
